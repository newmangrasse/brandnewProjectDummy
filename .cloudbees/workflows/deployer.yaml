apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true

jobs:
  puzzle-game-editedX-newVersion:
    if: ${{ fromJSON(inputs.manifest)['puzzle-game-editedX']['newVersion'].deploy }}
    uses: newmangrasse/puzzle-game/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ fromJSON(inputs.manifest)['puzzle-game-editedX']['newVersion'].id }}
      environment: ${{ inputs.environment }}
  puzzle-game-editedX-puzzle-game-artifact:
    if: ${{ fromJSON(inputs.manifest)['puzzle-game-editedX']['puzzle-game-artifact'].deploy }}
    uses: newmangrasse/puzzle-game/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ fromJSON(inputs.manifest)['puzzle-game-editedX']['puzzle-game-artifact'].id }}
      environment: ${{ inputs.environment }}
