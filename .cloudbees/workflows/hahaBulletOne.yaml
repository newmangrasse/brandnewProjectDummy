apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Build and Deploy Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    steps:
      - name: Set up workspace
        uses: docker://alpine:latest
        shell: sh
        run: |
          echo "Workspace ready"

      - name: Checkout code
        uses: cloudbees-io/checkout@v1

      - name: Set up Node.js
        uses: docker://node:18-alpine
        shell: sh
        run: |
          node --version
          npm --version

      - name: Install dependencies
        uses: docker://node:18-alpine
        shell: sh
        run: |
          npm install

      - name: Run tests
        uses: docker://node:18-alpine
        shell: sh
        run: |
          npm test

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        with:
          results-path: '**/test-results/*.xml'
          test-type: JUNIT

      - name: Build application
        uses: docker://node:18-alpine
        shell: sh
        run: |
          npm run build
          tar -czf app.tar.gz dist/

      - name: Deploy to production
        uses: docker://alpine:latest
        shell: sh
        run: |
          echo "Deploying application to production..."
          echo "Artifact ready: app.tar.gz"
          echo "Deployment completed successfully"

      - name: Register deployment
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          name: brandnewProjectDummy-artifact
          version: ${{ cloudbees.scm.sha }}
          environment: production
          url: https://github.com/${{ cloudbees.scm.repository }}/releases/download/${{ cloudbees.scm.sha }}/app.tar.gz

      - name: Finalize job
        uses: docker://alpine:latest
        shell: sh
        run: |
          echo "Job completed successfully"
